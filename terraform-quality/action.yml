name: Terraform quality
description: Check Terraform formatting, then validate and lint selected roots with backend-free init on Linux; optionally run caller-owned offline tests.
inputs:
  roots:
    description: Newline-separated repository-relative roots or globs with single-component '*'; selects validation, linting and optional tests. Recursive '**' is not supported.
    default: environments/*
  run-tests:
    description: Set to 'true' to run caller-owned tests. Use only fully mocked or otherwise offline tests; backend-free init does not prevent real infrastructure creation.
    default: 'false'
  terraform-version:
    description: Exact Terraform version. Empty selects the pinned default. A matching terraform on PATH is reused.
    default: ''
runs:
  using: composite
  steps:
    # Keep these two steps identical in every Terraform action; tests enforce it.
    - name: Select Terraform
      id: terraform
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TERRAFORM_VERSION: ${{ inputs.terraform-version }}
      run: '"$ACTION_PATH/../scripts/terraform-version"'
    # The wrapper rewrites stdout for step outputs and mangles plan output in logs.
    - if: steps.terraform.outputs.install == 'true'
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.terraform.outputs.version }}
        terraform_wrapper: false
    - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: v0.65.0
        # SHA256 of tflint_linux_amd64.zip and tflint_linux_arm64.zip.
        checksums: |
          d4c545ed2e29d6338604b586f34f544f380f70f243aa72f7b484713835eaec61
          843017c47a98be1de4d88fa038daa293770fe25cd01656c4f08b2e30d1d3b3a0
    - name: Check formatting, validate and lint each root; optionally test
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TERRAFORM_ROOTS: ${{ inputs.roots }}
        TERRAFORM_RUN_TESTS: ${{ inputs.run-tests }}
        # TFLint plugin downloads use the GitHub API rate limit.
        GITHUB_TOKEN: ${{ github.token }}
      run: '"$ACTION_PATH/../scripts/terraform-quality"'
