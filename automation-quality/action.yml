name: Automation quality
description: Install pinned tools and lint workflows and repository shell scripts on Linux AMD64.
inputs:
  shellcheck-excludes:
    description: Comma-separated ShellCheck codes, justified in the caller repository.
    default: ""
runs:
  using: composite
  steps:
    - name: Install and run automation linters
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SHELLCHECK_EXCLUDES: ${{ inputs.shellcheck-excludes }}
      run: '"$ACTION_PATH/../scripts/automation-quality"'
    - name: Audit Actions security
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        inputs: .
        version: 1.29.0
        persona: regular
        advanced-security: false
        annotations: true
