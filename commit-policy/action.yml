name: Commit policy
description: Validate a PR title or the checked-out squash commit with the shared Commitizen version.
inputs:
  message:
    description: Message to check; an empty value checks the checked-out commit instead.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - name: Check conventional commit
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        COMMIT_MESSAGE: ${{ inputs.message }}
      run: '"$ACTION_PATH/../scripts/with-commitizen" check'
