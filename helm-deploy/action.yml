name: Helm deploy
description: Install or upgrade a Helm release with server-side apply and wait until it is ready. Adopts existing objects until the release has a successful revision; attempts rollback on failure after that. Rejects retained uninstalled releases.
inputs:
  release:
    description: Helm release name.
    required: true
  chart:
    description: Path of the chart directory.
    required: true
  namespace:
    description: Release namespace.
    required: true
  values:
    description: Newline-separated values files, applied in order.
    default: ""
  set-string:
    description: Newline-separated key=value pairs passed as --set-string, applied after the values files. Values may not contain commas.
    default: ""
  timeout:
    description: Helm --timeout for the release and each hook, as a number and one unit (s, m or h), such as 15m. Set it above the longest hook deadline plus image pull time.
    default: 15m
outputs:
  revision:
    description: The deployed release revision.
    value: ${{ steps.deploy.outputs.revision }}
  mode:
    description: "'adopt' when the release had no successful revision and this run used --take-ownership; 'upgrade' when it used --rollback-on-failure."
    value: ${{ steps.deploy.outputs.mode }}
runs:
  using: composite
  steps:
    - name: Helm deploy
      id: deploy
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RELEASE: ${{ inputs.release }}
        CHART: ${{ inputs.chart }}
        NAMESPACE: ${{ inputs.namespace }}
        VALUES: ${{ inputs.values }}
        SET_STRING: ${{ inputs.set-string }}
        TIMEOUT: ${{ inputs.timeout }}
      run: '"$ACTION_PATH/../scripts/helm-deploy"'
