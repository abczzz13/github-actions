version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /go-quality
      - /automation-quality
      - /go-security
      - /semgrep
      - /commit-policy
      - /commitizen-bump
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories:
      - /scripts
      - /tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
