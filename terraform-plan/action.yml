name: Terraform plan
description: Initialize the configured backend and plan one Terraform root on Linux; authenticate first.
inputs:
  root:
    description: Repository-relative Terraform root directory.
    required: true
  terraform-version:
    description: Exact Terraform version. Empty selects the pinned default. A matching terraform on PATH is reused.
    default: ''
outputs:
  changes:
    description: "'true' when the plan has changes, 'false' when it has none."
    value: ${{ steps.plan.outputs.changes }}
runs:
  using: composite
  steps:
    # Keep these two steps identical in every Terraform action; tests enforce it.
    - name: Select Terraform
      id: terraform
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TERRAFORM_VERSION: ${{ inputs.terraform-version }}
      run: '"$ACTION_PATH/../scripts/terraform-version"'
    # The wrapper rewrites stdout for step outputs and mangles plan output in logs.
    - if: steps.terraform.outputs.install == 'true'
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.terraform.outputs.version }}
        terraform_wrapper: false
    - name: Plan
      id: plan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TERRAFORM_ROOT: ${{ inputs.root }}
      run: '"$ACTION_PATH/../scripts/terraform-run" plan'
