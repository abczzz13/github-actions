name: Set up Helm
description: Install the Helm version that consumers' chart checks and deployments share.
outputs:
  version:
    description: Installed Helm version, such as v4.2.4. Compare a local or Nix-provided Helm with it.
    # Keep equal to the version below; tests/test_actions.py checks this.
    value: v4.2.4
runs:
  using: composite
  steps:
    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: v4.2.4
